name: Deploy Account Recovery Firebase Functions

on:
  push:
    branches:
      - fix/account-recovery-v105
    paths:
      - "functions/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-account-recovery-functions.yml"

permissions:
  contents: read

concurrency:
  group: account-recovery-functions-production
  cancel-in-progress: false

jobs:
  deploy-account-recovery:
    name: Build and deploy account recovery callables
    runs-on: ubuntu-latest
    environment: account-recovery
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Firebase Functions dependencies
        run: npm install --prefix functions --legacy-peer-deps --no-audit --no-fund

      - name: Build Firebase Functions
        run: npm run build --prefix functions

      - name: Configure Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT secret in account-recovery environment."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy only account recovery functions
        run: |
          npx --yes firebase-tools deploy \
            --only functions:requestAccountRecovery,functions:listAccountRecoveryRequests,functions:approveAccountRecovery,functions:revokeAccountRecovery,functions:completeAccountRecovery \
            --project a-drop-of-blood-saves-a-life \
            --non-interactive
