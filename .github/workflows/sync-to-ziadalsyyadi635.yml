name: "Sync Code to ziadalsyyadi635"

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync-to-primary-repo:
    name: "Mirror main branch to ziadalsyyadi-ctrl/ziadalsyyadi635"
    if: github.repository != 'ziadalsyyadi-ctrl/ziadalsyyadi635'
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout full repository history"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Push code to ziadalsyyadi-ctrl/ziadalsyyadi635"
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "::error::Missing repository secret GH_RELEASE_TOKEN. Create a Classic Personal Access Token with 'repo' and 'workflow' scopes on account ziadalsyyadi-ctrl and add it as GH_RELEASE_TOKEN in this repository."
            exit 1
          fi

          git config --unset-all http.https://github.com/.extraheader || true

          REPO_HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ziadalsyyadi-ctrl/ziadalsyyadi635")
          echo "Target repository API check HTTP status: $REPO_HTTP"
          if [ "$REPO_HTTP" != "200" ]; then
            echo "::error::GH_RELEASE_TOKEN cannot access ziadalsyyadi-ctrl/ziadalsyyadi635 (HTTP $REPO_HTTP). Check that GH_RELEASE_TOKEN is valid and has 'repo' and 'workflow' scopes."
            exit 1
          fi

          ASKPASS_SCRIPT="$(mktemp)"
          trap 'rm -f "$ASKPASS_SCRIPT"' EXIT
          printf '#!/bin/sh\ncase "$1" in\n  *Username*) printf "%%s\\n" "x-access-token" ;;\n  *Password*) printf "%%s\\n" "$GH_RELEASE_TOKEN" ;;\nesac\n' > "$ASKPASS_SCRIPT"
          chmod 700 "$ASKPASS_SCRIPT"

          TARGET_URL="https://github.com/ziadalsyyadi-ctrl/ziadalsyyadi635.git"

          # Preserve android/app/google-services.json when AI Studio sync omits it
          if [ ! -s "android/app/google-services.json" ]; then
            if [ -s "public/assets/aistudio/google-services_05d71302.json" ]; then
              cp public/assets/aistudio/google-services_05d71302.json android/app/google-services.json
            elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
              if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '"project_info"'; then
                printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
              else
                printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
              fi
            elif GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$ASKPASS_SCRIPT" git fetch --depth=1 "$TARGET_URL" main && \
                 git cat-file -e FETCH_HEAD:android/app/google-services.json 2>/dev/null; then
              git show FETCH_HEAD:android/app/google-services.json > android/app/google-services.json
            fi

            if [ -s "android/app/google-services.json" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add android/app/google-services.json
              git commit -m "ci: preserve android/app/google-services.json"
            fi
          fi

          if ! GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$ASKPASS_SCRIPT" git push --force \
            "$TARGET_URL" "HEAD:refs/heads/main"; then
            echo "::error::git push to ziadalsyyadi-ctrl/ziadalsyyadi635 failed. Ensure GH_RELEASE_TOKEN has BOTH 'repo' AND 'workflow' scopes (required to update .github/workflows/*)."
            exit 1
          fi

          echo "Successfully synced main branch to ziadalsyyadi-ctrl/ziadalsyyadi635."
