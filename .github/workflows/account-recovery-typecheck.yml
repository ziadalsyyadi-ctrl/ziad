name: Account Recovery TypeScript Checks

on:
  push:
    branches:
      - fix/account-recovery-v105
    paths:
      - "src/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.frontend.json"
      - ".github/workflows/account-recovery-typecheck.yml"
  pull_request:
    branches:
      - fix/account-recovery-v105
    paths:
      - "src/**"
      - "functions/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.frontend.json"
      - ".github/workflows/account-recovery-typecheck.yml"

permissions:
  contents: read

jobs:
  frontend-types:
    name: Frontend TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Check frontend TypeScript
        run: npx tsc --noEmit --project tsconfig.frontend.json

  firebase-functions-types:
    name: Firebase Functions TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Functions dependencies
        run: npm install --legacy-peer-deps --no-package-lock --no-audit --no-fund
      - name: Check Functions TypeScript
        run: npm run lint
